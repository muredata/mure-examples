# Sidecar in front of the DuckDB UI (same Fargate task, shared loopback).
#
# The DuckDB UI listens on 127.0.0.1:4213 and only accepts query requests whose
# Origin is http://localhost:4213, as a CSRF guard for a local tool. Behind
# CloudFront the browser origin is https://<distribution>. This proxy keeps an
# equivalent guard: it only accepts requests whose Origin is PUBLIC_ORIGIN, then
# rewrites Host and Origin to what the UI expects. Authentication happens before
# this hop (Cognito via Lambda@Edge); the ALB only accepts traffic from the
# CloudFront VPC origin.

global
    log stdout format raw local0 info
    maxconn 512
    # Set by the ECS task definition. If it is missing, the placeholder matches no
    # browser origin, so every query request is rejected (fail closed).
    presetenv PUBLIC_ORIGIN "https://unset.invalid"

defaults
    mode http
    log global
    option httplog
    option http-server-close
    timeout connect 5s
    timeout client  310s
    timeout server  310s
    timeout http-request 30s
    # Server-sent events (/localEvents) stay open for a long time.
    timeout tunnel 1h

frontend web
    bind :8080
    # ALB health check: 200 only while the DuckDB UI backend is up.
    monitor-uri /healthz
    acl ddb_down nbsrv(duckdb) lt 1
    monitor fail if ddb_down

    acl has_origin   req.hdr(origin) -m found
    acl origin_ok    req.hdr(origin) -m str "${PUBLIC_ORIGIN}"
    acl safe_method  method GET HEAD
    # Cross-site requests are rejected. Browsers always send Origin on POST.
    http-request deny deny_status 403 if has_origin !origin_ok
    http-request deny deny_status 403 if !safe_method !has_origin

    # The DuckDB UI never needs the Cognito cookies or any credential header.
    http-request del-header cookie
    http-request del-header authorization
    http-request set-header Host localhost:4213
    http-request set-header Origin http://localhost:4213
    http-request del-header x-forwarded-host

    http-response del-header server
    default_backend duckdb

backend duckdb
    option httpchk
    http-check send meth GET uri /info hdr Host localhost:4213
    http-check expect status 200
    # The UI binds to "localhost", which resolves to ::1 when the kernel has IPv6
    # loopback and to 127.0.0.1 otherwise. Health checks pick whichever is up.
    server ui6 [::1]:4213 check inter 5s fall 3 rise 1
    server ui4 127.0.0.1:4213 check inter 5s fall 3 rise 1 backup
